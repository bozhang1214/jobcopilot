[build-system]
# setuptools>=77 才能用 PEP 639 的 license 表达式（见下方 license 字段）
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobcopilot"
version = "0.1.0"
description = "求职分析内核：把一份 JD / 一批职位变成结构化求职情报"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "bozhang1214" }]
keywords = ["job", "career", "llm", "agent", "mcp", "求职", "招聘分析"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    # 注意：PEP 639 下用了 license 表达式就不能再写 License:: classifier，
    #       否则 setuptools 直接拒绝构建。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# 内核零第三方依赖：分析逻辑只依赖标准库。
# 需要「自带模型调用」再装 jobcopilot[providers]。
dependencies = []

[project.scripts]
jobcopilot = "jobcopilot.cli.main:main"
jobcopilot-mcp = "jobcopilot.mcp.server:main"

# ⚠️ [project.urls] 必须放在 [project] 的表内键全部写完之后：
#    TOML 的表作用域会持续到下一个表头，放早了会把后面的 dependencies 吞进
#    project.urls 里（构建时报 “project.urls.dependencies must be string”）。
[project.urls]
Homepage = "https://github.com/bozhang1214/jobcopilot"
Repository = "https://github.com/bozhang1214/jobcopilot"
Issues = "https://github.com/bozhang1214/jobcopilot/issues"
Documentation = "https://github.com/bozhang1214/jobcopilot/tree/main/docs/integrations"

[project.optional-dependencies]
providers = ["httpx>=0.27"]
mcp = ["mcp>=1.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mcp>=1.1.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobcopilot = [
    "core/prompts/base/*.md",
    "core/prompts/packs/**/*.md",
    "evals/datasets/**/*.json",
    "evals/baselines/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
